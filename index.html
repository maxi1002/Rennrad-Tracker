<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ride Log – Rennrad-Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#f6f6f4;--card:#fff;--tx:#1d1d1f;--mu:#6b6b70;--ac:#fc4c02;--bd:#e3e3df}
@media(prefers-color-scheme:dark){:root{--bg:#141416;--card:#1f1f23;--tx:#eee;--mu:#9a9aa0;--bd:#33333a}}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;gap:12px;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:1000}
header h1{font-size:18px;margin:0;flex:1;cursor:pointer;color:var(--ac)}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.st b{display:block;font-size:22px}.st span{color:var(--mu);font-size:12px;text-transform:uppercase}
.ride{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--bd);cursor:pointer}
.ride:first-child{border:0}.ride small{color:var(--mu)}
#map{height:340px;border-radius:12px;margin-bottom:16px}
canvas{width:100%;height:150px;display:block}
#drop{border:2px dashed var(--bd);text-align:center;color:var(--mu);padding:14px;border-radius:12px;margin-bottom:16px}
#drop.on{border-color:var(--ac)}
h3{margin:0 0 8px;font-size:14px;color:var(--mu)}
.cw{position:relative;touch-action:pan-y;cursor:crosshair}
.cur{position:absolute;top:0;bottom:0;width:1px;background:var(--tx);opacity:.7;display:none;pointer-events:none}
#ro{position:sticky;top:62px;z-index:900;padding:8px 16px;margin-bottom:8px;font-variant-numeric:tabular-nums}
input.t{font:inherit;background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 10px}
</style>
</head>
<body>
<header><h1 onclick="home()">🚴 Ride Log</h1>
<label class="btn">Importieren<input id="file" type="file" accept=".gpx,.fit" multiple hidden></label>
<button class="sec" onclick="exportAll()">Backup</button></header>
<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
// ---------- IndexedDB ----------
const DB=new Promise((res,rej)=>{const r=indexedDB.open('ridelog',1);r.onupgradeneeded=()=>r.result.createObjectStore('rides',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(m,f)=>{const db=await DB;return new Promise((res,rej)=>{const s=db.transaction('rides',m).objectStore('rides');const q=f(s);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
const allRides=()=>tx('readonly',s=>s.getAll()),getRide=id=>tx('readonly',s=>s.get(id)),putRide=r=>tx('readwrite',s=>s.put(r)),delRide=id=>tx('readwrite',s=>s.delete(id));

// ---------- Parser ----------
function parseGPX(txt){
 const d=new DOMParser().parseFromString(txt,'text/xml'),pts=[];
 const g=(e,n)=>{const x=[...e.getElementsByTagName('*')].find(c=>c.localName==n);return x?+x.textContent:undefined};
 for(const e of d.getElementsByTagName('trkpt')){
  const t=[...e.children].find(c=>c.localName=='time');
  pts.push({lat:+e.getAttribute('lat'),lon:+e.getAttribute('lon'),ele:g(e,'ele'),t:t?Date.parse(t.textContent):undefined,hr:g(e,'hr'),cad:g(e,'cad'),pw:g(e,'power')});
 }
 const nm=d.getElementsByTagName('name')[0];
 return{name:nm?nm.textContent:null,points:pts};
}
function parseFit(buf){
 const v=new DataView(buf),hs=v.getUint8(0),end=hs+v.getUint32(4,true);
 let p=hs,defs={},pts=[],last=0;
 const INV={1:0xFF,2:0xFFFF,4:0xFFFFFFFF};
 while(p<end){
  const h=v.getUint8(p++);let d,ts;
  if(h&0x80){d=defs[(h>>5)&3];const o=h&31;ts=(last&~31)+o;if(o<(last&31))ts+=32;last=ts}
  else if(h&0x40){
   p++;const le=v.getUint8(p++)==0,gm=v.getUint16(p,le);p+=2;const n=v.getUint8(p++),f=[];
   for(let i=0;i<n;i++){f.push([v.getUint8(p),v.getUint8(p+1)]);p+=3}
   let dev=0;if(h&0x20){const nd=v.getUint8(p++);for(let i=0;i<nd;i++)dev+=v.getUint8(p+i*3+1);p+=nd*3}
   defs[h&15]={le,gm,f,dev};continue;
  } else d=defs[h&15];
  const r={};
  for(const[id,sz]of d.f){
   let x;
   if(sz==4)x=(id==0||id==1)?v.getInt32(p,d.le):v.getUint32(p,d.le);
   else if(sz==2)x=v.getUint16(p,d.le);else if(sz==1)x=v.getUint8(p);
   if(x!==undefined&&x!==INV[sz]&&x!==0x7FFFFFFF)r[id]=x;
   p+=sz;
  }
  p+=d.dev;
  if(r[253]!==undefined){last=r[253];ts=r[253]}
  if(d.gm==20&&r[0]!==undefined&&r[1]!==undefined){
   const e=r[78]??r[2],s=r[73]??r[6];
   pts.push({lat:r[0]*180/2**31,lon:r[1]*180/2**31,ele:e!==undefined?e/5-500:undefined,hr:r[3],cad:r[4],pw:r[7],
    d:r[5]!==undefined?r[5]/100:undefined,sp:s!==undefined?s/1000:undefined,t:ts!==undefined?(ts+631065600)*1000:undefined});
  }
 }
 return{name:null,points:pts};
}

// ---------- Analyse ----------
const hav=(a,b)=>{const R=6371000,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lon-a.lon)*r;
 const x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
const ELE_STEP=1.0; // Höhenunterschiede unter diesem Wert (in m) zählen nicht
function analyse(pts){
 let dist=0,mov=0,gain=0,loss=0,ref=pts.find(p=>p.ele!==undefined)?.ele,maxsp=0;
 pts.forEach((p,i)=>{
  if(i){const a=pts[i-1],dd=p.d!==undefined&&a.d!==undefined?p.d-a.d:hav(a,p);dist+=dd;
   const dt=p.t&&a.t?(p.t-a.t)/1000:0;
   p.sp=p.sp??(dt>0?dd/dt:0);if(dt>0&&dt<=30&&p.sp>0.8)mov+=dt;}
  else p.sp=p.sp??0;
  p.dist=dist;
  if(p.ele!==undefined&&ref!==undefined){const df=p.ele-ref;if(df>=ELE_STEP){gain+=df;ref=p.ele}else if(df<=-ELE_STEP){loss-=df;ref=p.ele}}
  if(p.sp>maxsp&&p.sp<30)maxsp=p.sp;
 });
 const avg=k=>{const a=pts.filter(p=>p[k]!==undefined);return a.length?a.reduce((s,p)=>s+p[k],0)/a.length:null};
 const mx=k=>{const a=pts.filter(p=>p[k]!==undefined).map(p=>p[k]);return a.length?Math.max(...a):null};
 const el=pts[0]?.t&&pts.at(-1)?.t?(pts.at(-1).t-pts[0].t)/1000:0;
 const eles=pts.map(p=>p.ele).filter(e=>e!==undefined);
 // beste 20-Min-Leistung
 let best20=null;const pw=pts.filter(p=>p.pw!==undefined&&p.t);
 if(pw.length>60){let j=0,s=0;for(let i=0;i<pw.length;i++){s+=pw[i].pw;while(pw[i].t-pw[j].t>1200000){s-=pw[j].pw;j++}
  if(pw[i].t-pw[j].t>=1140000){const a=s/(i-j+1);if(!best20||a>best20)best20=a}}}
 return{dist,moving:mov,elapsed:el,gain,loss,avgSpeed:mov?dist/mov:0,maxSpeed:maxsp,avgHr:avg('hr'),maxHr:mx('hr'),avgPw:avg('pw'),maxPw:mx('pw'),avgCad:avg('cad'),maxEle:eles.length?Math.max(...eles):null,best20};
}

// ---------- Formatierung ----------
const km=m=>(m/1000).toFixed(1)+' km',kmh=s=>(s*3.6).toFixed(1)+' km/h';
const dur=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h ${String(m).padStart(2,'0')}m`:`${m}m ${String(s%60).padStart(2,'0')}s`};
const dt=t=>new Date(t).toLocaleString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stat=(l,v)=>v==null||v===''?'':`<div class="st"><b>${v}</b><span>${l}</span></div>`;
const $=id=>document.getElementById(id);
let map,ridesCache=[];

// ---------- Import ----------
async function importFiles(files){
 for(const f of files){
  try{
   const ext=f.name.split('.').pop().toLowerCase();
   const r=ext=='fit'?parseFit(await f.arrayBuffer()):parseGPX(await f.text());
   if(r.points.length<2)throw new Error('Keine Trackpunkte');
   const all=await allRides(),t0=r.points[0].t||f.lastModified;
   if(all.some(x=>x.date==t0&&x.file==f.name)){alert(f.name+': bereits importiert');continue}
   const stats=analyse(r.points);
   await putRide({name:r.name||'Ausfahrt '+new Date(t0).toLocaleDateString('de-DE'),date:t0,file:f.name,stats,sv:2,points:r.points});
  }catch(e){alert(f.name+': Import fehlgeschlagen ('+e.message+')')}
 }
 home();
}
$('file').onchange=e=>{importFiles([...e.target.files]);e.target.value=''};
addEventListener('dragover',e=>{e.preventDefault();$('drop')?.classList.add('on')});
addEventListener('dragleave',()=>$('drop')?.classList.remove('on'));
addEventListener('drop',e=>{e.preventDefault();importFiles([...e.dataTransfer.files])});

// ---------- Dashboard ----------
async function home(){
 stopWind();if(map){map.remove();map=null}
 const rides=(await allRides()).sort((a,b)=>b.date-a.date);
 const tot=rides.reduce((a,r)=>({d:a.d+r.stats.dist,t:a.t+r.stats.moving,g:a.g+r.stats.gain}),{d:0,t:0,g:0});
 ridesCache=rides;
 const rec=(k,f)=>rides.length?rides.reduce((b,r)=>r.stats[k]>b.stats[k]?r:b,rides[0]):null;
 const longest=rec('dist'),climb=rec('gain'),fast=rec('avgSpeed'),topv=rec('maxSpeed');
 const pr=(l,r,f)=>r&&r.stats[f[0]]?`<div class="ride" onclick="show(${r.id})"><span>${l}<br><small>${esc(r.name)}</small></span><b>${f[1](r.stats[f[0]])}</b></div>`:'';
 $('app').innerHTML=`
 <div id="drop">GPX- oder FIT-Dateien hierher ziehen oder oben auf „Importieren“ klicken</div>
 ${rides.length?`
 <div class="card"><h3>GESAMT</h3><div class="grid">${stat('Ausfahrten',rides.length)}${stat('Distanz',(tot.d/1000).toFixed(0)+' km')}${stat('Fahrzeit',dur(tot.t))}${stat('Höhenmeter',Math.round(tot.g)+' m')}${stat('Ø Tempo',tot.t?kmh(tot.d/tot.t):null)}</div></div>
 <div class="card"><h3>KILOMETER PRO WOCHE (LETZTE 12)</h3><canvas id="wk"></canvas></div>
 <div class="card"><h3>LEISTUNGSENTWICKLUNG</h3><div style="display:flex;gap:8px;margin-bottom:6px"><button id="pm0" onclick="pmode('real')">Ø Tempo</button><button id="pm1" class="sec" onclick="pmode('adj')">Höhenkorrigiert</button></div><p id="pn" style="margin:0 0 8px;color:var(--mu);font-size:12px"></p><canvas id="pf" style="height:180px"></canvas><p id="pd" style="margin:8px 0 0;font-weight:600"></p></div>
 <div class="card"><h3>REKORDE</h3>${pr('Längste Ausfahrt',longest,['dist',km])}${pr('Meiste Höhenmeter',climb,['gain',v=>Math.round(v)+' m'])}${pr('Höchster Schnitt',fast,['avgSpeed',kmh])}${topv&&topv.stats.maxSpeed?`<div class="ride" onclick="show(${topv.id})"><span>Höchstgeschwindigkeit<br><small>${esc(topv.name)}</small></span><span style="white-space:nowrap"><b>${kmh(topv.stats.maxSpeed)}</b> <button class="sec" id="hb" title="Verlauf anzeigen" onclick="event.stopPropagation();hist()">▾</button></span></div><div id="hist" hidden><canvas id="hc" style="height:180px"></canvas></div>`:''}</div>
 <div class="card"><h3>AKTIVITÄTEN</h3>${rides.map(r=>`<div class="ride" onclick="show(${r.id})"><span><b>${esc(r.name)}</b><br><small>${dt(r.date)}</small></span><span style="text-align:right">${km(r.stats.dist)}<br><small>${dur(r.stats.moving)} · ${Math.round(r.stats.gain)} m · ${kmh(r.stats.avgSpeed)}</small></span></div>`).join('')}</div>`
 :'<div class="card">Noch keine Ausfahrten. Importiere deine erste GPX- oder FIT-Datei.</div>'}`;
 if(rides.length){weekly(rides);perf(rides)}
}
function weekly(rides){
 const W=6048e5,now=Date.now(),mon=(()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return +d})();
 const b=Array(12).fill(0);rides.forEach(r=>{const i=11-Math.floor((mon-r.date+W-1)/W);if(r.date>=mon)b[11]+=r.stats.dist;else{const k=11-Math.ceil((mon-r.date)/W);if(k>=0)b[k]+=r.stats.dist}});
 bars($('wk'),b.map(x=>x/1000));
}
function hist(){
 const h=$('hist'),open=h.hidden;h.hidden=!open;$('hb').textContent=open?'▴':'▾';$('hb').title=open?'Verlauf ausblenden':'Verlauf anzeigen';
 if(!open)return;
 const R=ridesCache.filter(r=>r.stats.maxSpeed>0).sort((a,b)=>a.date-b.date);
 const[x,w,hh]=setup($('hc')),pad=34,v=R.map(r=>r.stats.maxSpeed*3.6);
 let lo=Math.min(...v),hi=Math.max(...v);if(hi-lo<5){lo-=2.5;hi+=2.5}
 const t0=R[0].date,t1=R.at(-1).date;
 const px=r=>pad+(w-pad-8)*(t1>t0?(r.date-t0)/(t1-t0):.5),py=y=>hh-18-(hh-30)*(y-lo)/(hi-lo);
 const ds=t=>new Date(t).toLocaleDateString('de-DE');
 x.fillStyle=css('--mu');x.font='11px system-ui';
 x.fillText(Math.round(hi)+' km/h',0,12);x.fillText(Math.round(lo),0,hh-18);x.fillText(ds(t0),pad,hh-2);
 x.textAlign='right';x.fillText(ds(t1),w,hh-2);x.textAlign='left';
 // Stufenlinie des jeweiligen Rekords
 let m=0,prev=0;x.strokeStyle=css('--ac');x.lineWidth=2;x.beginPath();
 R.forEach((r,i)=>{m=Math.max(m,v[i]);const X=px(r);i?(x.lineTo(X,py(prev)),x.lineTo(X,py(m))):x.moveTo(X,py(m));prev=m});
 x.lineTo(w-8,py(m));x.stroke();
 // Punkte: jede Ausfahrt, Rekordfahrten hervorgehoben
 m=0;x.fillStyle=css('--ac');
 R.forEach((r,i)=>{const rec=v[i]>m;m=Math.max(m,v[i]);x.globalAlpha=rec?1:.4;x.beginPath();x.arc(px(r),py(v[i]),rec?5:3,0,7);x.fill()});
 x.globalAlpha=1;
}
let perfMode='real';
function pmode(m){perfMode=m;perf(ridesCache)}
function perf(rides){
 const B=perfMode=='adj';
 $('pm0').className=B?'sec':'';$('pm1').className=B?'':'sec';
 $('pn').textContent=B?'(Distanz + Höhenmeter / 100) ÷ Bewegungszeit – Höhenmeter zählen als zusätzliche flache Kilometer':'Distanz ÷ Bewegungszeit';
 $('pd').style.fontWeight=600;
 const mo={};
 rides.forEach(r=>{
  if(!(r.stats.moving>0))return;
  const d=new Date(r.date),k=d.getFullYear()*12+d.getMonth(),m=(mo[k]=mo[k]||{d:0,t:0});
  m.d+=r.stats.dist+(B?r.stats.gain*10:0);m.t+=r.stats.moving; // 100 hm = 1 km = 1000 m; Bewegungszeit
 });
 const ms=Object.keys(mo).map(Number).sort((a,b)=>a-b).map(k=>({k,v:mo[k].d/mo[k].t*3.6}));
 const e=$('pd');
 if(!ms.length){e.textContent='Keine Fahrten mit Zeitdaten vorhanden.';e.style.color=css('--mu');return}
 const f1=n=>n.toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1});
 const nm=(k,o)=>new Date(Math.floor(k/12),k%12).toLocaleDateString('de-DE',o);
 const[x,w,h]=setup($('pf')),pad=24,k0=ms[0].k,span=ms.at(-1).k-k0;
 const vs=ms.map(m=>m.v);let lo=Math.min(...vs),hi=Math.max(...vs);
 if(hi-lo<2){lo-=1;hi+=1}else{const p=(hi-lo)*.15;lo-=p;hi+=p}
 const px=k=>span?pad+(w-2*pad)*(k-k0)/span:w/2,py=y=>h-26-(h-54)*(y-lo)/(hi-lo);
 x.font='11px system-ui';x.textAlign='center';
 // Monatsbeschriftung
 const step=Math.ceil((span+1)/8);x.fillStyle=css('--mu');
 for(let i=0;i<=span;i+=step)x.fillText(nm(k0+i,{month:'short',year:'2-digit'}),px(k0+i),h-8);
 // Linie
 x.strokeStyle=css('--ac');x.lineWidth=2;x.beginPath();
 ms.forEach((m,i)=>i?x.lineTo(px(m.k),py(m.v)):x.moveTo(px(m.k),py(m.v)));x.stroke();
 // Punkte + Werte
 ms.forEach((m,i)=>{
  x.fillStyle=css('--ac');x.beginPath();x.arc(px(m.k),py(m.v),4,0,7);x.fill();
  if(ms.length<=14||i==0||i==ms.length-1){x.fillStyle=css('--tx');x.fillText(f1(m.v),px(m.k),py(m.v)-9)}
 });
 // Veränderung zum Vormonat (die zwei letzten Monate mit Fahrten)
 if(ms.length<2){e.textContent='Für einen Monatsvergleich werden mindestens zwei Monate mit Fahrten benötigt.';e.style.color=css('--mu');e.style.fontWeight=400;return}
 const a=ms.at(-2),b=ms.at(-1),pc=(b.v/a.v-1)*100,up=pc>=0,L={month:'long',year:'numeric'};
 e.style.color=up?'#1a9e4b':'#d33';
 e.textContent=`${up?'▲ +':'▼ '}${f1(pc)} %  (${nm(b.k,L)}: ${f1(b.v)} km/h vs. ${nm(a.k,L)}: ${f1(a.v)} km/h)`;
}
function setup(c){const r=c.getBoundingClientRect(),k=devicePixelRatio||1;c.width=r.width*k;c.height=r.height*k;const x=c.getContext('2d');x.scale(k,k);return[x,r.width,r.height]}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n);
function bars(c,v){
 const[x,w,h]=setup(c),m=Math.max(...v,1),bw=w/v.length;x.font='11px system-ui';x.textAlign='center';
 v.forEach((y,i)=>{const bh=(h-24)*y/m;x.fillStyle=css('--ac');x.fillRect(i*bw+4,h-14-bh,bw-8,bh);x.fillStyle=css('--mu');if(y)x.fillText(Math.round(y),i*bw+bw/2,h-18-bh);});
}
// ---------- Detail ----------
async function show(id){
 const r=await getRide(id);if(!r)return home();
 const s=r.stats;
 $('app').innerHTML=`
 <p><button class="sec" onclick="home()">← Zurück</button></p>
 <div class="card"><input class="t" id="nm" value="${esc(r.name)}" style="font-size:18px;font-weight:600;width:100%"><p style="color:var(--mu);margin:6px 0 12px">${dt(r.date)}</p>
 <div class="grid">${stat('Distanz',km(s.dist))}${stat('Fahrzeit',dur(s.moving))}${stat('Gesamtzeit',s.elapsed?dur(s.elapsed):null)}${stat('Ø Tempo',kmh(s.avgSpeed))}${stat('Max Tempo',kmh(s.maxSpeed))}${stat('Anstieg',Math.round(s.gain)+' m')}${stat('Abstieg',Math.round(s.loss)+' m')}${stat('Ø Puls',s.avgHr&&Math.round(s.avgHr)+' bpm')}${stat('Max Puls',s.maxHr&&s.maxHr+' bpm')}${stat('Ø Leistung',s.avgPw&&Math.round(s.avgPw)+' W')}${stat('Max Leistung',s.maxPw&&s.maxPw+' W')}${stat('Beste 20 min',s.best20&&Math.round(s.best20)+' W')}${stat('Ø Kadenz',s.avgCad&&Math.round(s.avgCad)+' rpm')}</div></div>
 <p><button class="sec" id="wb">💨 Wind-Animation</button> <span id="wl" style="color:var(--mu)"></span></p>
 <div id="map"></div>
 <div class="card" id="ro">Mit der Maus über ein Diagramm oder die Route fahren</div>
 <div id="charts"></div>
 <p><button class="sec" onclick="dl(${id})">Als GPX exportieren</button> <button class="sec" onclick="del(${id})">Löschen</button></p>`;
 $('nm').onchange=async e=>{r.name=e.target.value;await putRide(r)};
 map=L.map('map');L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
 const ll=r.points.map(p=>[p.lat,p.lon]);const line=L.polyline(ll,{color:'#fc4c02',weight:4}).addTo(map);map.fitBounds(line.getBounds());
 L.circleMarker(ll[0],{color:'#2a2',radius:6}).addTo(map);L.circleMarker(ll.at(-1),{color:'#c22',radius:6}).addTo(map);
 const defs=[['ele','Höhe (m)','#7a7',v=>v],['sp','Geschwindigkeit (km/h)','#fc4c02',v=>v*3.6],['hr','Puls (bpm)','#d33',v=>v],['pw','Leistung (W)','#a4c',v=>v],['cad','Kadenz (rpm)','#39c',v=>v]];
 const n=r.points.length,step=Math.max(1,Math.floor(n/600));const pts=r.points.filter((_,i)=>i%step==0||i==n-1);
 defs.forEach(([k,l,col,f])=>{
  if(!pts.some(p=>p[k]!==undefined))return;
  const d=document.createElement('div');d.className='card';d.innerHTML=`<h3>${l.toUpperCase()}</h3><div class="cw"><canvas></canvas><i class="cur"></i></div>`;$('charts').append(d);
  line2(d.querySelector('canvas'),pts,k,col,f);
 });
 // Cursor: Diagramm <-> Karte
 const P=r.points,D=P.at(-1).dist||1,PAD=34,ro=$('ro');
 const mk=L.circleMarker(ll[0],{radius:7,color:'#fff',weight:2,fillColor:'#1a73e8',fillOpacity:1});
 const setCur=fr=>{
  const t=fr*D;let lo=0,hi=P.length-1;
  while(lo<hi){const m=(lo+hi)>>1;P[m].dist<t?lo=m+1:hi=m}
  const p=P[lo];mk.setLatLng([p.lat,p.lon]).addTo(map);
  document.querySelectorAll('.cur').forEach(c=>{const w=c.parentNode.clientWidth;c.style.left=(PAD+(w-PAD)*fr)+'px';c.style.display='block'});
  ro.textContent=[(p.dist/1000).toFixed(1)+' km',p.ele!==undefined&&Math.round(p.ele)+' m',(p.sp*3.6).toFixed(1)+' km/h',p.hr&&p.hr+' bpm',p.pw!==undefined&&p.pw+' W',p.cad!==undefined&&p.cad+' rpm'].filter(Boolean).join(' · ');
 };
 document.querySelectorAll('.cw').forEach(w=>{
  const mv=e=>{const b=w.getBoundingClientRect();setCur(Math.min(1,Math.max(0,(e.clientX-b.left-PAD)/(b.width-PAD))))};
  w.onpointermove=mv;w.onpointerdown=mv;
 });
 line.on('mousemove',e=>{
  let bi=0,bd=1e9;
  ll.forEach((q,i)=>{const d=(q[0]-e.latlng.lat)**2+(q[1]-e.latlng.lng)**2;if(d<bd){bd=d;bi=i}});
  setCur(P[bi].dist/D);
 });
 // Wind
 $('wb').onclick=async()=>{
  if($('wc')){stopWind();$('wl').textContent='';return}
  $('wl').textContent='Lade Winddaten…';
  try{
   const w=await getWind(r);startWind(w);
   $('wl').textContent=`Ø ${(w.sp*3.6).toFixed(0)} km/h aus ${dirTxt(w.dir)} (${Math.round(w.dir)}°)`;
  }catch(e){const l=$('wl');if(l)l.textContent='Winddaten nicht verfügbar'}
 };
}
function line2(c,pts,k,col,f){
 const[x,w,h]=setup(c),v=pts.map(p=>p[k]!==undefined?f(p[k]):null),ok=v.filter(a=>a!=null);
 let lo=Math.min(...ok),hi=Math.max(...ok);if(hi==lo)hi=lo+1;const D=pts.at(-1).dist||1,pad=34;
 x.strokeStyle=col;x.fillStyle=col+'33';x.lineWidth=1.5;x.beginPath();let st=false,fx=0;
 pts.forEach((p,i)=>{if(v[i]==null)return;const px=pad+(w-pad)*p.dist/D,py=h-16-(h-24)*(v[i]-lo)/(hi-lo);st?x.lineTo(px,py):x.moveTo(px,py);st=true;fx=px});
 x.stroke();x.lineTo(fx,h-16);x.lineTo(pad,h-16);x.fill();
 x.fillStyle=css('--mu');x.font='11px system-ui';x.fillText(Math.round(hi),0,10);x.fillText(Math.round(lo),0,h-16);
 x.fillText('0 km',pad,h-2);x.textAlign='right';x.fillText((D/1000).toFixed(0)+' km',w,h-2);
}
// ---------- Wind (Open-Meteo, kein API-Key nötig) ----------
let raf=0;
const dirTxt=d=>['N','NO','O','SO','S','SW','W','NW'][Math.round(d/45)%8];
async function getWind(r){
 if(r.wind)return r.wind;
 const P=r.points,la=P.map(p=>p.lat),lo=P.map(p=>p.lon);
 const a=Math.min(...la)-.02,b=Math.max(...la)+.02,c=Math.min(...lo)-.02,e=Math.max(...lo)+.02;
 const lats=[a,(a+b)/2,b],lons=[c,(c+e)/2,e],LA=[],LO=[];
 lats.forEach(y=>lons.forEach(x=>{LA.push(y.toFixed(3));LO.push(x.toFixed(3))}));
 const t=P[0].t&&P.at(-1).t?(P[0].t+P.at(-1).t)/2:r.date,iso=new Date(t).toISOString();
 const day=iso.slice(0,10),key=iso.slice(0,13)+':00',old=Date.now()-t>7*864e5;
 const url=`https://${old?'archive-api':'api'}.open-meteo.com/v1/${old?'archive':'forecast'}?latitude=${LA}&longitude=${LO}&hourly=wind_speed_10m,wind_direction_10m&wind_speed_unit=ms&timezone=GMT&`+(old?`start_date=${day}&end_date=${day}`:'past_days=7&forecast_days=1');
 const j=await(await fetch(url)).json(),arr=Array.isArray(j)?j:[j];
 const i=arr[0].hourly.time.indexOf(key);if(i<0)throw 0;
 const u=[],v=[];
 arr.forEach(o=>{const s=o.hourly.wind_speed_10m[i],d=o.hourly.wind_direction_10m[i]*Math.PI/180;u.push(-s*Math.sin(d));v.push(-s*Math.cos(d))});
 const mu=u.reduce((x,y)=>x+y)/9,mv=v.reduce((x,y)=>x+y)/9;
 r.wind={lats,lons,u,v,sp:Math.hypot(mu,mv),dir:(Math.atan2(-mu,-mv)*180/Math.PI+360)%360};
 await putRide(r);return r.wind;
}
function windAt(w,lat,lon){
 const f=(v,ar)=>{const x=Math.min(1.999,Math.max(0,(v-ar[0])/(ar[2]-ar[0])*2)),i=Math.floor(x);return[i,x-i]};
 const[i,ty]=f(lat,w.lats),[j,tx]=f(lon,w.lons);
 const g=k=>{const q=(a,b)=>k[(i+a)*3+j+b];return q(0,0)*(1-ty)*(1-tx)+q(0,1)*(1-ty)*tx+q(1,0)*ty*(1-tx)+q(1,1)*ty*tx};
 return[g(w.u),g(w.v)];
}
function startWind(w){
 stopWind();
 const cv=document.createElement('canvas');cv.id='wc';
 cv.style.cssText='position:absolute;left:0;top:0;z-index:450;pointer-events:none';
 map.getContainer().append(cv);
 const x=cv.getContext('2d');let W,H;
 const size=()=>{const s=map.getSize();W=cv.width=s.x;H=cv.height=s.y};size();
 map.on('resize',size);map.on('movestart zoomstart',()=>x.clearRect(0,0,W,H));
 const spawn=p=>{p.x=Math.random()*W;p.y=Math.random()*H;p.a=Math.random()*60|0;return p};
 const ps=Array.from({length:350},()=>spawn({}));
 (function f(){
  x.globalCompositeOperation='destination-out';x.fillStyle='rgba(0,0,0,.07)';x.fillRect(0,0,W,H);
  x.globalCompositeOperation='source-over';x.strokeStyle='rgba(20,90,200,.85)';x.lineWidth=1.5;x.beginPath();
  for(const p of ps){
   const c=map.containerPointToLatLng([p.x,p.y]),[u,v]=windAt(w,c.lat,c.lng);
   const nx=p.x+u*.7,ny=p.y-v*.7;x.moveTo(p.x,p.y);x.lineTo(nx,ny);p.x=nx;p.y=ny;
   if(++p.a>90||nx<0||ny<0||nx>W||ny>H)spawn(p);
  }
  x.stroke();raf=requestAnimationFrame(f);
 })();
}
function stopWind(){cancelAnimationFrame(raf);document.getElementById('wc')?.remove()}
async function del(id){if(confirm('Ausfahrt wirklich löschen?')){await delRide(id);home()}}
function save(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
async function dl(id){
 const r=await getRide(id);
 const g=`<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="Ride Log" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>${esc(r.name)}</name><trkseg>${r.points.map(p=>`<trkpt lat="${p.lat}" lon="${p.lon}">${p.ele!==undefined?`<ele>${p.ele}</ele>`:''}${p.t?`<time>${new Date(p.t).toISOString()}</time>`:''}</trkpt>`).join('')}</trkseg></trk></gpx>`;
 save(r.name+'.gpx',g,'application/gpx+xml');
}
async function exportAll(){save('ridelog-backup.json',JSON.stringify(await allRides()),'application/json')}
(async()=>{for(const r of await allRides())if(r.sv!==2){r.stats=analyse(r.points);r.sv=2;await putRide(r)}home()})();
</script>
